name: skill-check

# Guards the sunnyside-* skill suite: the .agents/ mirror must match, the scripts' tests must
# pass, static gates must clear self-test, and one known-good case must still clear every gate.

on:
  push:
    paths:
      - 'skills/**'
      - '.agents/skills/**'
      - 'features/**'
      - 'public/brand/**'
      - '.github/workflows/skill-check.yml'
  pull_request:
    paths:
      - 'skills/**'
      - '.agents/skills/**'
      - 'features/**'
      - 'public/brand/**'
      - '.github/workflows/skill-check.yml'

jobs:
  skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Mirrors are in sync (fix with scripts/sync-all-skills.sh)
        run: |
          diff -rq skills/sunnyside-brand-system .agents/skills/sunnyside-brand-system
          diff -rq skills/sunnyside-taste-ui .agents/skills/sunnyside-taste-ui
          diff -rq skills/sunnyside-components .agents/skills/sunnyside-components
          diff -rq skills/sunnyside-review .agents/skills/sunnyside-review
          diff -rq skills/sunnyside-dashboard-system .agents/skills/sunnyside-dashboard-system
          diff -rq skills/sunnyside-print .agents/skills/sunnyside-print
          diff -rq skills/sunnyside-thumbnail .agents/skills/sunnyside-thumbnail
          diff -rq skills/implement-brand-system .agents/skills/implement-brand-system
      - name: Unit tests
        run: node --test "skills/sunnyside-brand-system/scripts/test/*.test.mjs"
      - name: Static gates self-test
        run: node skills/sunnyside-brand-system/scripts/gates.mjs --self-test
      # Sunnyside is the known-good case that ships in this repo
      - name: Known-good case still clears every gate
        run: node skills/sunnyside-brand-system/scripts/gates.mjs --slug sunnyside
