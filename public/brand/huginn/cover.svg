<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc"><title id="title">Huginn Studio brand board</title><desc id="desc">Bone and vermilion identity board with Threshold Print mark, print typography and an ordered-dither field.</desc><defs><pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.6" fill="#B82117"/><circle cx="8" cy="8" r="1.6" fill="#B82117"/></pattern></defs><rect width="1200" height="900" fill="#F2E8D8"/><rect x="26" y="26" width="1148" height="848" fill="none" stroke="#171210" stroke-width="3"/><text x="60" y="84" font-family="monospace" font-size="18" letter-spacing="4" fill="#171210">HUGINN STUDIO / BRAND SYSTEM 03</text><rect x="60" y="118" width="1080" height="438" fill="#B82117"/><path fill="#F4EFE5" d="M115 177h236v44H159v242h-44zM250 292h44v171h-44z"/><circle cx="294" cy="336" r="14" fill="#171210"/><circle cx="332" cy="374" r="9" fill="#171210"/><circle cx="369" cy="411" r="5" fill="#171210"/><text x="430" y="274" font-family="Georgia,serif" font-size="96" fill="#F4EFE5">Huginn</text><text x="436" y="322" font-family="monospace" font-size="17" letter-spacing="4" fill="#F4EFE5">THOUGHT IN PRINT</text><rect x="790" y="350" width="350" height="206" fill="url(#dots)" opacity=".8"/><path d="M60 606h1080" stroke="#171210" stroke-width="2"/><text x="60" y="666" font-family="monospace" font-size="17" letter-spacing="3" fill="#171210">BONE / INK / VERMILION / BRASS</text><text x="60" y="735" font-family="Georgia,serif" font-size="52" fill="#171210">A thought crosses the threshold.</text><text x="60" y="795" font-family="monospace" font-size="15" letter-spacing="2" fill="#5A5048">ORDERED DITHER · BITMAP LETTERING · NO SECOND EFFECT</text><rect x="1038" y="630" width="64" height="64" fill="#B82117"/><path fill="#F4EFE5" d="M1046 638h48v8h-40v40h-8zM1066 658h8v28h-8z"/></svg>
