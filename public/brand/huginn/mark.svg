<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" color="#100f0e" fill="currentColor" role="img" aria-label="Huginn">
  <title>Huginn — the dissolve: a corner of cells, one leaving</title>
  <!--
    The only primitive is the cell. Five cells thin toward the corner; the
    sixth has left the grid and is printed vermilion. Nothing else.
  -->
  <rect x="6" y="10" width="14" height="14"/>
  <rect x="23" y="10" width="14" height="14"/>
  <rect x="6" y="27" width="14" height="14"/>
  <rect x="23" y="27" width="14" height="14"/>
  <rect x="6" y="44" width="14" height="14"/>
  <rect x="43" y="6" width="14" height="14" fill="var(--hg-escape, #e2281b)"/>
</svg>
