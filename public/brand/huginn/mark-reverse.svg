<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="#f4efe5" role="img" aria-label="Huginn">
  <title>Huginn — reverse: the grid printed on the vermilion field</title>
  <!-- On the field the cells are bone; the escapee keeps the field's own red as
       a knockout, so the mark still reads as "one cell has left". -->
  <rect x="6" y="10" width="14" height="14"/>
  <rect x="23" y="10" width="14" height="14"/>
  <rect x="6" y="27" width="14" height="14"/>
  <rect x="23" y="27" width="14" height="14"/>
  <rect x="6" y="44" width="14" height="14"/>
  <rect x="43" y="6" width="14" height="14" fill="#e2281b"/>
</svg>
